<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, nofollow">

<title>Access Verification</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

body{
background:#050505;
font-family:'Plus Jakarta Sans',sans-serif;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.container{
max-width:650px;
width:100%;
text-align:center;
}

.badge{
display:inline-block;
padding:8px 16px;
border:1px solid rgba(255,255,255,.08);
border-radius:999px;
font-size:12px;
letter-spacing:2px;
color:#888;
margin-bottom:35px;
}

.title{
font-size:clamp(42px,8vw,82px);
font-weight:800;
letter-spacing:-3px;
line-height:1;
margin-bottom:25px;
}

.description{
max-width:500px;
margin:auto;
color:#8d8d8d;
line-height:1.9;
font-size:16px;
}

.steps{
margin-top:35px;
text-align:left;
display:inline-block;
color:#bdbdbd;
line-height:2.2;
font-size:15px;
}

.bot{
color:#fff;
font-weight:700;
}

.input{
width:100%;
max-width:350px;
margin-top:35px;
padding:18px;
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
outline:none;
color:#fff;
font-size:15px;
text-align:center;
}

.button{
margin-top:18px;
display:inline-block;
padding:18px 34px;
border-radius:999px;
text-decoration:none;
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.02);
color:#fff;
font-weight:700;
cursor:pointer;
transition:.25s;
}

.button:hover{
background:#fff;
color:#000;
}

.message{
margin-top:20px;
font-size:14px;
color:#777;
min-height:20px;
}

.footer{
margin-top:40px;
font-size:12px;
letter-spacing:3px;
color:#444;
}

.success{
color:#77ff77;
}

.error{
color:#ff7777;
}

#popup-notif{
position:fixed;
bottom:20px;
left:20px;
background:#111;
color:#fff;
padding:12px 16px;
border-radius:12px;
font-size:13px;
z-index:9999;
display:none;
box-shadow:0 0 15px rgba(0,0,0,.5);
border:1px solid #222;
}
    
</style>
</head>
<body>

<div id="popup-notif"></div>    

<div class="container">

<div class="badge">
ACCESS VERIFICATION
</div>

<h1 class="title">
Verify Access
</h1>

<p class="description">
To continue, retrieve the current access code from our Telegram bot and enter it below.
</p>

<div class="steps">
1. Open Telegram<br>
2. Search <span class="bot">@xfreecodebot</span><br>
3. Send <span class="bot">/start</span><br>
4. Copy the access code<br>
5. Enter the code below
</div>

<br>

<input
type="text"
id="codeInput"
class="input"
placeholder="Enter Access Code">

<br>

<button class="button" onclick="verifyCode()">
Verify Access
</button>

<div id="message" class="message"></div>

<div class="footer">
PRIVATE ACCESS ONLY
</div>

</div>

<script>

const VALID_CODE = "FEFE2026%";

function verifyCode(){

const input =
document.getElementById("codeInput").value.trim();

const message =
document.getElementById("message");

if(input === VALID_CODE){

message.innerHTML =
'<span class="success">Access Granted. Redirecting...</span>';

setTimeout(() => {

    sessionStorage.setItem('verified', 'true');

    window.location.href =
    'https://t.me/+8hP-Er1j_jFjYTA1';

}, 1200);

}else{

message.innerHTML =
'<span class="error">Invalid access code.</span>';

}

}

document
.getElementById("codeInput")
.addEventListener("keypress", function(e){

if(e.key === "Enter"){
verifyCode();
}

});

</script>    

<script>

const messages = [
"🔥 1 orang baru mendapatkan akses",
"🔥 2 orang baru mendapatkan akses",
"🔥 3 orang sedang online sekarang",
"🔥 4 orang baru bergabung",
"🔥 5 orang sedang melihat konten",
"🔥 6 orang baru mendapatkan akses",
"🔥 7 orang sedang aktif sekarang",
"🔥 8 orang baru bergabung",
"🔥 9 orang sedang melihat konten",
"🔥 10 orang baru mendapatkan akses"
];

function showNotif(){

const box = document.getElementById("popup-notif");

const random =
messages[Math.floor(Math.random()*messages.length)];

box.innerHTML = random;

box.style.display = "block";

setTimeout(()=>{
box.style.display = "none";
},4000);

}

setInterval(showNotif,7000);
setTimeout(showNotif,3000);

</script>
    
</body>
</html>
