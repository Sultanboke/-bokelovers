<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">
  
<title>Private Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{
width:100%;
height:100%;
overflow:hidden;
}

body{
font-family:'Plus Jakarta Sans',sans-serif;
background:#050505;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
padding:32px;
}

.container{
max-width:760px;
text-align:center;
}

.badge{
display:inline-block;
padding:8px 16px;
border:1px solid rgba(255,255,255,.08);
border-radius:999px;
font-size:12px;
font-weight:600;
letter-spacing:2px;
color:#8f8f8f;
margin-bottom:42px;
}

.glitch{
position:relative;
display:inline-block;
font-size:clamp(58px,10vw,105px);
font-weight:800;
line-height:.95;
letter-spacing:-4px;
animation:glitch-skew 7s infinite;
}

.glitch::before,
.glitch::after{
content:attr(data-text);
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
}

.glitch::before{
left:2px;
clip-path:inset(0 0 55% 0);
opacity:.7;
animation:glitch-top 5s infinite;
}

.glitch::after{
left:-2px;
clip-path:inset(55% 0 0 0);
opacity:.5;
animation:glitch-bottom 4s infinite;
}

@keyframes glitch-top{
0%,96%,100%{transform:none;}
97%{transform:translate(-2px,-1px);}
98%{transform:translate(2px,1px);}
99%{transform:none;}
}

@keyframes glitch-bottom{
0%,94%,100%{transform:none;}
95%{transform:translate(2px,0);}
96%{transform:translate(-3px,1px);}
97%{transform:none;}
}

@keyframes glitch-skew{
0%,94%,100%{transform:none;}
95%{transform:skewX(5deg);}
96%{transform:skewX(-5deg);}
97%{transform:none;}
}

.description{
margin-top:34px;
max-width:580px;
margin-left:auto;
margin-right:auto;
font-size:18px;
line-height:1.9;
color:#8a8a8a;
}

.button{
display:inline-flex;
align-items:center;
justify-content:center;
margin-top:48px;
padding:18px 34px;
text-decoration:none;
color:#fff;
border:1px solid rgba(255,255,255,.12);
border-radius:999px;
font-weight:700;
font-size:15px;
background:rgba(255,255,255,.02);
backdrop-filter:blur(10px);
transition:.25s ease;
}

.button:hover{
background:#fff;
color:#000;
}

.cta{
margin-top:24px;
font-size:13px;
line-height:1.9;
color:#5d5d5d;
letter-spacing:1px;
text-transform:uppercase;
}

.footer{
margin-top:42px;
font-size:12px;
letter-spacing:3px;
color:#404040;
}

@media(max-width:768px){

.glitch{
font-size:68px;
}

.description{
font-size:16px;
}

.button{
width:100%;
max-width:300px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="badge">
PRIVATE • 21+
</div>

<h1 class="glitch" data-text="Private Access">
Private Access
</h1>

<p class="description">
New content is shared every day.
Join now and get instant access to everything inside.
</p>

<a href="https://t.me/+ZkeKQ8hiPMw5MDk1" class="button">
Join Private Group
</a>

<p class="cta">
DAILY UPDATES • EXCLUSIVE CONTENT • OPEN ACCESS
</p>

<div class="footer">
FOR THOSE WHO KNOW
</div>

</div>

</body>
</html>
