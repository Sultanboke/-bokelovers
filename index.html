<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Plus Jakarta Sans',sans-serif;
}

body{
background:#050505;
color:#fff;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.container{
max-width:700px;
text-align:center;
}

.badge{

padding:8px 16px;
border:1px solid rgba(255,255,255,.08);
border-radius:999px;
font-size:13px;
letter-spacing:2px;
color:#8a8a8a;
margin-bottom:40px;
}

h1{
font-size:clamp(52px,9vw,96px);
font-weight:800;
line-height:0.95;
letter-spacing:-4px;
margin-bottom:30px;
}

p{
font-size:18px;
line-height:1.8;
color:#8f8f8f;
max-width:550px;
margin:auto;
}

.button{
display:inline-flex;
align-items:center;
justify-content:center;
margin-top:50px;
padding:18px 34px;
text-decoration:none;
color:#000;
background:#fff;
border-radius:999px;
font-weight:700;
transition:.3s;
}

.button:hover{
transform:translateY(-2px);
}

.footer{
margin-top:40px;
font-size:13px;
letter-spacing:2px;
color:#555;
}

</style>
</head>

PRIVATE • 21+

Private<br>
Access

A private circle for selected members.
Limited access. No public sharing.
No unnecessary noise.
</p>

<a href="https://t.me/+ZkeKQ8hiPMw5MDk1" class="button">
Request Invitation
</a>

<div class="footer">
INVITATION ONLY
</div>

</div>

</body>
</html>
