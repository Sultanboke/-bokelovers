<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Telegram: Japanese | Indo Viral</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .thumbnail {
      aspect-ratio: 16 / 9;
      background-size: cover;
      background-position: center;
    }
    .play-btn {
      transition: all 0.2s;
    }
    .video-card:hover .play-btn {
      transform: scale(1.1);
      color: #22c55e;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen pb-20">

  <!-- Header -->
  <div class="bg-[#229ED9] py-3 text-center font-medium text-lg flex items-center justify-center gap-2 sticky top-0 z-50">
    <i class="fa-solid fa-rocket"></i>
    Join Telegram: Japanese | Indo Viral
  </div>

  <!-- Grid Video -->
  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="video-grid">
      <!-- Video items akan digenerate oleh JS -->
    </div>
  </div>

  <!-- Pagination -->
  <div class="flex justify-center gap-2 my-8">
    <button onclick="changePage(1)" class="w-10 h-10 flex items-center justify-center bg-pink-600 rounded-lg font-bold">1</button>
    <button onclick="changePage(2)" class="w-10 h-10 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 rounded-lg">2</button>
    <button onclick="changePage(3)" class="w-10 h-10 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 rounded-lg">3</button>
    <button class="w-10 h-10 flex items-center justify-center bg-zinc-800 hover:bg-zinc-700 rounded-lg">
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <!-- Footer -->
  <div class="text-center text-gray-500 text-sm py-6 border-t border-gray-800">
    © 2026 by Telegram
  </div>

  <script>
    // GANTI LINK TELEGRAM INI
    const telegramLink = "https://t.me/+yourlinkhere";

    const videos = [
      { title: "Japanese Wife Massage", img: "https://picsum.photos/id/1015/600/340" },
      { title: "Hot Spring Scene", img: "https://picsum.photos/id/201/600/340" },
      { title: "Couple Moment", img: "https://picsum.photos/id/237/600/340" },
      { title: "Indo Japanese Mix", img: "https://picsum.photos/id/180/600/340" },
      { title: "Late Night Talk", img: "https://picsum.photos/id/251/600/340" },
      { title: "Romantic Dinner", img: "https://picsum.photos/id/133/600/340" },
      { title: "Japanese Girl ASMR", img: "https://picsum.photos/id/64/600/340" },
      { title: "Steamy Scene", img: "https://picsum.photos/id/201/600/340" },
      { title: "Daily Life Vlog", img: "https://picsum.photos/id/180/600/340" }
    ];

    function renderVideos() {
      const grid = document.getElementById('video-grid');
      grid.innerHTML = '';

      videos.forEach(video => {
        const card = document.createElement('div');
        card.className = "video-card bg-zinc-900 rounded-xl overflow-hidden cursor-pointer";
        card.innerHTML = `
          <div class="thumbnail relative" style="background-image: url('${video.img}')">
            <div class="absolute inset-0 bg-black/30 flex items-center justify-center play-btn">
              <i class="fa-solid fa-play text-5xl text-white drop-shadow-lg"></i>
            </div>
          </div>
          <div class="p-3">
            <p class="font-medium line-clamp-2 text-sm">${video.title}</p>
            <div class="flex gap-3 mt-3">
              <button onclick="goToTelegram(event)" 
                      class="flex-1 bg-green-500 hover:bg-green-600 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> Play
              </button>
              <button onclick="goToTelegram(event)" 
                      class="flex-1 bg-blue-600 hover:bg-blue-700 py-2 rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> Download
              </button>
            </div>
          </div>
        `;
        // Klik seluruh card juga ke Telegram
        card.addEventListener('click', (e) => {
          if (!e.target.closest('button')) goToTelegram(e);
        });
        grid.appendChild(card);
      });
    }

    function goToTelegram(e) {
      e.stopImmediatePropagation();
      window.open(telegramLink, '_blank');
    }

    function changePage(page) {
      alert(`Halaman ${page} (Demo - bisa dihubungkan ke lebih banyak video nanti)`);
      // Bisa ditambah logika load video berbeda per halaman
    }

    // Render saat halaman dimuat
    window.onload = renderVideos;
  </script>
</body>
</html>
