<!DOCTYPE html>
<html lang="id">
<head>

<script>
if (sessionStorage.getItem('verified') !== 'true') {
    sessionStorage.setItem(
        'redirectAfterVerify',
        window.location.href
    );
    window.location.href = '/verify/';
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">

<title>Private Content</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
color:#fff;
font-family:'Plus Jakarta Sans',sans-serif;
padding:24px;
}

.container{
max-width:900px;
margin:auto;
}

.page-title{
text-align:center;
font-size:20px;
font-weight:700;
margin-bottom:40px;
color:#fff;
}

.item{
padding:24px 0;
border-bottom:1px solid rgba(255,255,255,.06);
}

.item h2{
font-size:18px;
font-weight:600;
line-height:1.5;
margin-bottom:10px;
}

.item a{
color:#8c8c8c;
text-decoration:none;
font-size:14px;
word-break:break-all;
transition:.2s;
}

.item a:hover{
color:#fff;
}

.footer{
text-align:center;
margin-top:40px;
font-size:12px;
color:#444;
letter-spacing:2px;
}

</style>

</head>
<body>

<div class="container">

<div class="page-title">
Selamat Menikmati Link Penyegar Jiwa
</div>

<div id="content"></div>

<div class="footer">
PRIVATE ACCESS
</div>

</div>

<script>

fetch('./zozox.json')
.then(response => response.json())
.then(data => {

const container = document.getElementById('content');

data.forEach(item => {

container.innerHTML += `
<div class="item">
<h2>${item.title}</h2>
<a href="${item.url}" target="_blank">
${item.url}
</a>
</div>
`;

});

});

</script>

</body>
</html>
