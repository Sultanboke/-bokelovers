<!DOCTYPE html>
<html lang="id">
<head>

<script>
if (sessionStorage.getItem('verified') !== 'true') {
    sessionStorage.setItem(
        'redirectAfterVerify',
        window.location.href
    );
    window.location.href = '/verify/';
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">

<title>Private Content</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
color:#fff;
font-family:'Plus Jakarta Sans',sans-serif;
padding:24px;
}

.container{
max-width:900px;
margin:auto;
}

.page-title{
text-align:center;
font-size:20px;
font-weight:700;
margin-bottom:40px;
color:#fff;
}

.item{
padding:20px 0;
border-bottom:1px solid rgba(255,255,255,.06);
}

.item a{
color:#b5b5b5;
text-decoration:none;
font-size:15px;
word-break:break-all;
transition:.2s;
}

.item a:hover{
color:#fff;
}

.footer{
text-align:center;
margin-top:40px;
font-size:12px;
color:#444;
letter-spacing:2px;
}

</style>

</head>
<body>

<div class="container">

<div class="page-title">
Click link dibawah ( 1 week 3x )
</div>

<div id="content"></div>

<div class="footer">
PRIVATE ACCESS
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const pageId = params.get('id');

fetch('./zozox.json?v=' + Date.now())
.then(response => response.json())
.then(data => {

const container =
document.getElementById('content');

if(!pageId){
container.innerHTML =
'<div class="item"><a>Content Not Found</a></div>';
return;
}

if(!data[pageId]){
container.innerHTML =
'<div class="item"><a>Invalid Content ID</a></div>';
return;
}

data[pageId].forEach(item => {

container.innerHTML += `
<div class="item">
<a href="${item.url}" target="_blank">
${item.url}
</a>
</div>
`;

});

})
.catch(() => {

document.getElementById('content').innerHTML =
'<div class="item"><a>Failed To Load Content</a></div>';

});

</script>

</body>
</html>
