<!DOCTYPE html>
<html lang="en">
<head>
  <script>
if (sessionStorage.getItem('verified') !== 'true') {
    window.location.href = '/verify/';
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex,nofollow">

<title>Access Granted</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
color:#fff;
font-family:'Plus Jakarta Sans',sans-serif;
padding:24px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
position:sticky;
top:0;
z-index:999;
background:#050505;
padding-bottom:24px;
margin-bottom:30px;
}

.join-btn{
display:block;
width:100%;
text-align:center;
padding:18px;
border-radius:999px;
text-decoration:none;
font-weight:700;
font-size:15px;
background:#fff;
color:#000;
transition:.25s;
}

.join-btn:hover{
transform:translateY(-2px);
}

.glitch{
position:relative;
display:inline-block;
font-size:42px;
font-weight:800;
margin-top:30px;
}

.glitch:before,
.glitch:after{
content:attr(data-text);
position:absolute;
left:0;
top:0;
}

.glitch:before{
animation:glitch1 3s infinite;
opacity:.6;
}

.glitch:after{
animation:glitch2 2s infinite;
opacity:.4;
}

@keyframes glitch1{
0%,97%,100%{transform:none;}
98%{transform:translate(-2px,1px);}
99%{transform:translate(2px,-1px);}
}

@keyframes glitch2{
0%,95%,100%{transform:none;}
96%{transform:translate(2px,0);}
97%{transform:translate(-2px,0);}
}

.subtitle{
margin-top:12px;
color:#777;
font-size:15px;
line-height:1.8;
margin-bottom:40px;
}

.section-title{
font-size:12px;
letter-spacing:3px;
color:#666;
margin-bottom:25px;
text-transform:uppercase;
}

.item{
padding:26px 0;
border-bottom:1px solid rgba(255,255,255,.06);
}

.item h2{
font-size:26px;
font-weight:700;
line-height:1.4;
margin-bottom:10px;
}

.item a{
color:#9f9f9f;
text-decoration:none;
font-size:15px;
word-break:break-all;
}

.item a:hover{
color:#fff;
}

.footer{
margin-top:60px;
text-align:center;
font-size:12px;
letter-spacing:3px;
color:#444;
padding-bottom:30px;
}

</style>
</head>
<body>

<div class="container">

<div class="header">

<a class="join-btn"
href="https://t.me/+ZkeKQ8hiPMw5MDk1">
Join Private Group
</a>

<h1 class="glitch" data-text="Access Granted">
Access Granted
</h1>

<p class="subtitle">
Latest updates available for members. New content is added regularly.
</p>

</div>

<div class="section-title">
Latest Updates
</div>

<div id="content"></div>

<div class="footer">
PRIVATE ACCESS
</div>

</div>

<script>

fetch('./data.json')
.then(response => response.json())
.then(data => {

const container =
document.getElementById('content');

data.forEach(item => {

container.innerHTML += `
<div class="item">
<h2>${item.title}</h2>
<a href="${item.url}" target="_blank">
${item.url}
</a>
</div>
`;

});

});

</script>

</body>
</html>
