<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#090909;
color:#fff;
}

.running{
background:#111;
border-bottom:1px solid #222;
padding:12px 0;
font-size:15px;
font-weight:500;
color:#ddd;
}

.container{
max-width:560px;
margin:35px auto;
padding:18px;
}

.thumbnail{
overflow:hidden;
border-radius:18px;
background:#151515;
border:1px solid #232323;
box-shadow:0 12px 35px rgba(0,0,0,.45);
}

.thumbnail img{
width:100%;
display:block;
aspect-ratio:1080/1350;
object-fit:cover;
}

.buttons{
margin-top:22px;
display:grid;
gap:14px;
}

.btn{
display:flex;
align-items:center;
justify-content:center;
height:58px;
background:#181818;
border:1px solid #2b2b2b;
border-radius:14px;
text-decoration:none;
color:#fff;
font-size:17px;
font-weight:600;
transition:.25s;
}

.btn:hover{
background:#229ED9;
border-color:#229ED9;
transform:translateY(-2px);
}

.footer{
text-align:center;
font-size:13px;
color:#777;
padding:25px;
}

@media(max-width:600px){

.container{
padding:14px;
margin-top:20px;
}

.btn{
height:54px;
font-size:16px;
}

}

</style>

</head>

<body>

<div class="running">
<marquee scrollamount="7">
🔥 New uploads available • Updated regularly • Enjoy browsing our gallery 🔥
</marquee>
</div>

<div class="container">

<div class="thumbnail">
<img id="thumb" src="" alt="Thumbnail">
</div>

<div class="buttons">

<a id="link1" class="btn" target="_blank">Open Link 1</a>

<a id="link2" class="btn" target="_blank">Open Link 2</a>

<a id="link3" class="btn" target="_blank">Open Link 3</a>

<a id="link4" class="btn" target="_blank">Open Link 4</a>

<a id="link5" class="btn" target="_blank">Open Link 5</a>

</div>

</div>

<div class="footer">
© 2026 Gallery
</div>

<script>

fetch("data.json")
.then(res=>res.json())
.then(data=>{

const id=new URLSearchParams(location.search).get("id")||0;

const item=data[id];

if(!item)return;

document.getElementById("thumb").src=item.thumbnail;

for(let i=0;i<5;i++){

const btn=document.getElementById("link"+(i+1));

if(item.links[i]){

btn.href=item.links[i];

}else{

btn.style.display="none";

}

}

});

</script>

</body>
</html>
