<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Gallery</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:#fff;
}

.running{
background:#fff;
color:#000;
font-weight:bold;
font-size:22px;
padding:12px 0;
}

.container{
max-width:700px;
margin:35px auto;
padding:0 15px;
}

.thumbnail{
width:100%;
aspect-ratio:1080/1350;
background:#111;
overflow:hidden;
border-radius:6px;
}

.thumbnail img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.btn{
display:block;
width:100%;
margin-top:16px;
padding:22px;
background:#ff2f2f;
color:#000;
font-size:32px;
font-weight:bold;
text-decoration:none;
text-align:center;
border-radius:5px;
transition:.25s;
}

.btn:hover{
background:#ff5555;
}

@media(max-width:600px){

.running{
font-size:17px;
}

.btn{
font-size:24px;
padding:18px;
}

}

</style>

</head>

<body>

<div class="running">
<marquee scrollamount="8" id="runningText">
Loading...
</marquee>
</div>

<div class="container">

<div class="thumbnail">
<img id="thumb" src="" alt="">
</div>

<a id="link1" class="btn" target="_blank">Link 1</a>
<a id="link2" class="btn" target="_blank">Link 2</a>
<a id="link3" class="btn" target="_blank">Link 3</a>
<a id="link4" class="btn" target="_blank">Link 4</a>
<a id="link5" class="btn" target="_blank">Link 5</a>

</div>

<script>

fetch("data.json")
.then(res=>res.json())
.then(data=>{

const id=new URLSearchParams(location.search).get("id")||0;

const item=data[id];

document.getElementById("runningText").textContent=item.running;

document.getElementById("thumb").src=item.thumbnail;

document.getElementById("link1").href=item.links[0];
document.getElementById("link2").href=item.links[1];
document.getElementById("link3").href=item.links[2];
document.getElementById("link4").href=item.links[3];
document.getElementById("link5").href=item.links[4];

});

</script>

</body>
</html>
