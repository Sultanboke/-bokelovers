<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simple Landing</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
}

.marquee{
    background:#fff;
    color:#000;
    font-size:24px;
    font-weight:bold;
    padding:12px 0;
}

.container{
    max-width:420px;
    margin:auto;
    padding:30px 15px;
}

.thumbnail{
    width:100%;
    aspect-ratio:1080/1350;
    border-radius:8px;
    overflow:hidden;
    margin-bottom:25px;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.btn{
    display:block;
    width:100%;
    text-align:center;
    background:#ff2b2b;
    color:#fff;
    text-decoration:none;
    font-size:24px;
    font-weight:bold;
    padding:18px;
    margin-bottom:15px;
    border-radius:6px;
    transition:.2s;
}

.btn:hover{
    background:#ff5555;
}
</style>
</head>

<body>

<div class="marquee">
<marquee scrollamount="8">
🔥 Welcome • Update Every Day • Join Telegram For More Content •
</marquee>
</div>

<div class="container">

<div class="thumbnail">
<img src="thumbnail.jpg">
</div>

<a href="#" class="btn">LINK 1</a>

<a href="#" class="btn">LINK 2</a>

<a href="#" class="btn">LINK 3</a>

<a href="#" class="btn">LINK 4</a>

<a href="#" class="btn">LINK 5</a>

</div>

</body>
</html>
