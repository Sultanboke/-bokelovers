<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Gallery</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#000;
color:#fff;
}

.marquee{
background:#fff;
color:#000;
padding:10px;
font-weight:bold;
}

.container{
display:flex;
flex-direction:column;
align-items:center;
padding:25px 0 60px;
}

.card{
width:300px;
max-width:90%;
margin-bottom:45px;
}

.thumb{
width:100%;
border-radius:12px;
overflow:hidden;
margin-bottom:15px;
}

.thumb img{
width:100%;
display:block;
}

.btn{
display:block;
width:100%;
padding:14px;
margin-bottom:10px;
background:#ff2020;
color:#fff;
text-align:center;
text-decoration:none;
font-size:18px;
font-weight:bold;
border-radius:10px;
transition:.2s;
}

.btn:hover{
background:#ff4444;
}

</style>

</head>
<body>

<div class="marquee">
<marquee scrollamount="7">
🔥 Updated Daily • Join Telegram • New Content Everyday 🔥
</marquee>
</div>

<div class="container" id="content"></div>

<script>

fetch("data.json")
.then(res=>res.json())
.then(data=>{

// Membalik urutan supaya data paling bawah tampil paling atas
data.reverse();

const content=document.getElementById("content");

data.forEach(item=>{

const card=document.createElement("div");
card.className="card";

let html=`
<div class="thumb">
<img src="${item.img}">
</div>
`;

item.buttons.forEach(btn=>{
html+=`
<a class="btn" href="${btn.url}" target="_blank">
${btn.text}
</a>
`;
});

card.innerHTML=html;

content.appendChild(card);

});

});

</script>

</body>
</html>
